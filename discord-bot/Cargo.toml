[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]

# internal dependencies
entity = { path = "../entity" }
migration = { path = "../migration" }
welcome-service = { path = "../service" }
img-gen = { path = "../img-gen" }
corelib = { path = "../corelib" }

# other dependencies
ab_glyph = "0.2.31"
image = "0.25.8"
poise = "0.6.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
reqwest = "0.12.23"
tempfile = "3.22.0"
uuid = { version = "1.18.1", features = ["v4"] }
thiserror = "2.0.16"
anyhow = "1.0.99"
chrono = "0.4.42"
async-trait = "0.1.89"

# logging/tracing
log = "0.4.28"
fastrace = { version = "0.7.14", features = ["enable"] }

# qr code
qrcode = "0.14.1"